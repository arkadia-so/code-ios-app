name: Cross-platform vector gate

# Asserts this repo reproduces the canonical fixtures in the orchestrator's
# `code/test-vectors/` — the same fixtures code-android-app asserts against. The
# two apps compute keys, signatures, and on-chain amounts in parallel Swift and
# Kotlin implementations; these vectors are what keeps the answers identical.
#
# Two jobs, each under one name on every event so either can be a required check:
#
#   "Vectors"                   -- the two vector packages. About 5 minutes.
#   "Flipcash build and tests"  -- builds the app and runs all of FlipcashTests.
#                                  Off pull_request it also runs the UI smoke test,
#                                  which reports but does not gate.
#
# Two packages because they cannot share a deployment target: FlipcashCore's
# transitive deps (BigDecimal, grpc/nio) pull a macOS floor that CrossPlatformVectors
# does not want. Both run on a simulator — the ed25519 under test moved from a
# host-buildable C package to the shared Kotlin XCFramework, which ships iOS only.

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache:
        description: outrun's cache namespace (ARK-81 bench; a fresh one is a cold cache)
        type: string
        default: outrun

# Only PR runs are superseded by a newer push. A push to main that cancelled its
# predecessor would also cancel the run that seeds the DerivedData cache (caches
# saved on main are the only ones other branches can read).
concurrency:
  group: vectors-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

env:
  OUTRUN_CACHE_URL: https://turbo-cache.arkadia.so
  OUTRUN_CACHE_TEAM: ${{ inputs.cache || 'outrun' }}

jobs:
  # ---------------------------------------------------------------- vectors --
  vectors:
    name: Vectors (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        id: [ed25519, core]
    runs-on: outrun-macos
    timeout-minutes: 30
    steps:
      - name: Start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      # FlipcashCore is swift-tools 6.1, which the image's default Xcode may
      # predate. Take the newest installed rather than pinning a version that
      # can drop out of the runner image.
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          # outrun (ARK-81): the Xcode and simulator runtimes are part of every command's key.
          echo "XCODE=$(xcodebuild -version | tr '\n' ' ')$(xcrun simctl list runtimes | grep -o 'iOS [0-9.]*' | sort -u | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Setup Bun (outrun)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Look vectors:${{ matrix.id }} up
        id: look
        run: .github/outrun/run lookup "vectors:${{ matrix.id }}"

      # Cold, FlipcashCore vectors spent 6-10 minutes compiling grpc/nio/protobuf.
      # Both packages build into ./.derived, which holds the compiled products and
      # the SwiftPM clones. A restore-key hit still saves under the new key, so a
      # manifest change refreshes it. PR runs can only read caches saved on main
      # or on their own PR ref.
      - name: Restore DerivedData
        if: steps.look.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .derived
          key: vectors-dd-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved', '!.derived/**') }}
          restore-keys: |
            vectors-dd-${{ runner.os }}-

      # Simulator model names turn over with each runner image, so pick whatever
      # iPhone is installed rather than naming one.
      - name: Pick a simulator
        if: steps.look.outputs.run == 'true'
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) for x in d[r] if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Ed25519 vectors
        if: ${{ steps.look.outputs.run == 'true' && (matrix.id == 'ed25519') }}
        working-directory: CrossPlatformVectors
        run: |
          xcodebuild test -scheme CrossPlatformVectors-Package \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/ed25519" \
            -quiet

      - name: FlipcashCore vectors
        if: ${{ steps.look.outputs.run == 'true' && (matrix.id == 'core') }}
        working-directory: FlipcashCoreVectors
        run: |
          xcodebuild test -scheme FlipcashCoreVectors-Package \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/core" \
            -quiet

      - name: Record vectors:${{ matrix.id }}
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record "vectors:${{ matrix.id }}" --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

  # ------------------------------------------------------------- app build --
  # outrun (ARK-81): two shards on two VMs. Each restores DerivedData and builds for testing (the
  # build is the same on both, so neither waits on a transfer), then runs half of FlipcashTests by
  # type, split by LPT on per-type durations (.github/outrun/app-durations.json, from a previous
  # result bundle; .github/outrun/app-shard.py). Shard 1 also runs the quarantined case beside
  # its tests, shard 2 the UI smoke test. Each shard is a command unit (app:1, app:2), and the quarantined case one of
  # its own (app:quarantined, never gating: recorded even red, so a known failure is replayed, not
  # rerun, until the app's inputs change).
  app:
    name: Flipcash build and tests (${{ matrix.shard }})
    runs-on: outrun-macos
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The app build and its 1664 tests took 22 of the previous 30 on a quiet
    # run, which leaves nothing for a slow runner.
    timeout-minutes: 60
    env:
      QUARANTINED: FlipcashTests/AttachPanelPlacementTests/openPanel_sitsAbovePlus()
    steps:
      - name: Start
        id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          # outrun (ARK-81): the Xcode and simulator runtimes are part of every command's key.
          echo "XCODE=$(xcodebuild -version | tr '\n' ' ')$(xcrun simctl list runtimes | grep -o 'iOS [0-9.]*' | sort -u | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Setup Bun (outrun)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Look app:${{ matrix.shard }} up
        id: look
        run: .github/outrun/run lookup "app:${{ matrix.shard }}"

      - name: Look the quarantined case up
        if: matrix.shard == 1
        id: lookq
        run: .github/outrun/run lookup "app:quarantined"

      - name: Build needed
        id: need
        run: echo "build=${{ steps.look.outputs.run == 'true' || steps.lookq.outputs.run == 'true' }}" >> "$GITHUB_OUTPUT"

      # Hashed before the build: afterwards .derived/ holds the SwiftPM checkouts,
      # whose Package.swift files would change the hash.
      - name: Cache key
        if: steps.need.outputs.build == 'true'
        id: key
        run: echo "dd=app-dd3-${{ runner.os }}-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}" >> "$GITHUB_OUTPUT"

      # Checkout gives every source a new mtime, so the app and test targets rebuild anyway;
      # what the cache saves is the built SwiftPM packages.
      - name: Restore app DerivedData
        if: steps.need.outputs.build == 'true'
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .derived/app
          key: ${{ steps.key.outputs.dd }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.key.outputs.dd }}-
            app-dd3-${{ runner.os }}-
            app-dd-${{ runner.os }}-

      - name: Pick a simulator
        if: steps.need.outputs.build == 'true'
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) for x in d[r] if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # outrun (ARK-81, tracer part 5): xcodebuild's source-control scan runs git about 100 times
      # (status, rev-parse, describe; 4,158 stats) on every build and test. GIT_DIR pointing
      # nowhere turns it off; SwiftPM's packages are resolved first, with git.
      - name: Resolve packages
        if: steps.need.outputs.build == 'true'
        run: |
          # outrun (ARK-81): 4.6 of the 8.7 GB restored are Variant-TSan, the Sanitizers plan's
          # build, which build-for-testing of the default plan never reads; the seed drops it.
          rm -rf .derived/app/Build/Products/Variant-TSan .derived/app/Build/Intermediates.noindex/Variant-TSan
          xcodebuild -resolvePackageDependencies -scheme Flipcash \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/app" \
            -skipMacroValidation -skipPackageUpdates -onlyUsePackageVersionsFromResolvedFile -quiet

      - name: App build
        if: steps.need.outputs.build == 'true'
        env:
          GIT_DIR: /var/empty/no-git
        run: |
          # v8: only the default plan's build; without -testPlan build-for-testing also builds the
          # Sanitizers plan's Variant-TSan (4.4 GB, half the seed), which no test here runs.
          xcodebuild build-for-testing -scheme Flipcash -testPlan AllTargets \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/app" \
            -skipMacroValidation -disableAutomaticPackageResolution \
            -quiet \
            COMPILER_INDEX_STORE_ENABLE=NO

      # outrun (ARK-81): what DerivedData holds, to cache only what a build reuses.
      - name: DerivedData sizes
        if: steps.need.outputs.build == 'true' && matrix.shard == 1
        continue-on-error: true
        run: du -sk .derived/app/* .derived/app/Build/*/* .derived/app/SourcePackages/* 2>/dev/null | sort -n | tail -15

      # outrun (ARK-81): saved by shard 1 only, and only when no DerivedData of these packages
      # was restored: a warm one already holds the built packages, and the save cost 55 s.
      - name: Save app DerivedData
        if: ${{ steps.need.outputs.build == 'true' && matrix.shard == 1 && github.event_name != 'pull_request' && !startsWith(steps.restore.outputs.cache-matched-key, steps.key.outputs.dd) }}
        uses: actions/cache/save@v4
        with:
          path: .derived/app
          key: ${{ steps.key.outputs.dd }}-${{ github.sha }}

      # Booted after the build, not during it: runs that booted during the build compiled slower.
      - name: Boot the simulator
        if: steps.need.outputs.build == 'true'
        id: boot
        run: |
          if [ "${{ matrix.shard }}" = 1 ] && [ "${{ steps.lookq.outputs.run }}" = true ]; then
            echo "q=$(xcrun simctl clone "${{ steps.sim.outputs.udid }}" outrun-quarantine)" >> "$GITHUB_OUTPUT"
          fi
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      # The quarantined case fails every time after its 90 s waits. Its verdict never gates, so
      # it runs on a clone of the simulator beside the other tests, through the .xctestrun the
      # build wrote (its own DerivedData, so the two xcodebuilds share nothing).
      - name: Start quarantined app tests beside the others
        if: matrix.shard == 1 && steps.lookq.outputs.run == 'true'
        run: |
          set -euo pipefail
          Q="${{ steps.boot.outputs.q }}"
          xcrun simctl boot "$Q"
          xcrun simctl bootstatus "$Q" -b
          XCTESTRUN=$(ls "$GITHUB_WORKSPACE"/.derived/app/Build/Products/*.xctestrun | head -1)
          nohup sh -c "GIT_DIR=/var/empty/no-git xcodebuild test-without-building -xctestrun '$XCTESTRUN' \
            -destination 'platform=iOS Simulator,id=$Q' \
            -derivedDataPath '$GITHUB_WORKSPACE/.derived/quarantine' \
            -parallel-testing-enabled NO \
            -test-iterations 1 -retry-tests-on-failure \
            -only-testing:'$QUARANTINED' \
            -resultBundlePath '${{ runner.temp }}/Quarantined.xcresult' > '${{ runner.temp }}/quarantine.log' 2>&1; echo \$? > '${{ runner.temp }}/quarantine.exit'" >/dev/null 2>&1 &

      - name: Shard selection
        if: steps.look.outputs.run == 'true'
        id: shard
        run: echo "args=$(python3 .github/outrun/app-shard.py ${{ matrix.shard }} .github/outrun/app-durations.json FlipcashTests 79)" >> "$GITHUB_OUTPUT"

      # This shard's part of FlipcashTests, serial (in parallel, Swift Testing starts every case
      # at once in the one test host and cases miss their time limits).
      - name: App tests
        if: steps.look.outputs.run == 'true'
        env:
          GIT_DIR: /var/empty/no-git
        run: |
          # shellcheck disable=SC2086
          xcodebuild test-without-building -scheme Flipcash \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/app" \
            -parallel-testing-enabled NO \
            -only-testing:FlipcashTests ${{ steps.shard.outputs.args }} \
            -skip-testing:"$QUARANTINED" \
            -resultBundlePath "${{ runner.temp }}/AppTests.xcresult"

      # The signed-out smoke test that needs no network; reports, does not gate.
      - name: UI smoke tests
        id: ui
        if: ${{ matrix.shard == 2 && steps.look.outputs.run == 'true' && github.event_name != 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 15
        env:
          GIT_DIR: /var/empty/no-git
        run: |
          xcodebuild test-without-building -scheme Flipcash \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/.derived/app" \
            -only-testing:FlipcashUITests/MnemonicEntrySmokeTests \
            -resultBundlePath "${{ runner.temp }}/UISmoke.xcresult"

      - name: Quarantined app tests
        if: matrix.shard == 1 && steps.lookq.outputs.run == 'true'
        id: quarantine
        continue-on-error: true
        timeout-minutes: 10
        run: |
          for _ in $(seq 600); do [ -f "${{ runner.temp }}/quarantine.exit" ] && break; sleep 1; done
          cat "${{ runner.temp }}/quarantine.log"
          exit "$(cat "${{ runner.temp }}/quarantine.exit" 2>/dev/null || echo 1)"

      - name: Record app:${{ matrix.shard }}
        if: success() && steps.look.outputs.run == 'true'
        run: .github/outrun/run record "app:${{ matrix.shard }}" --key "${{ steps.look.outputs.key }}" --since ${{ steps.start.outputs.at }}

      - name: Record the quarantined case
        if: ${{ !cancelled() && (steps.quarantine.outcome == 'success' || steps.quarantine.outcome == 'failure') }}
        run: .github/outrun/run record "app:quarantined" --key "${{ steps.lookq.outputs.key }}" --since ${{ steps.start.outputs.at }} ${{ steps.quarantine.outcome == 'failure' && '--failed' || '' }}

      - name: Result bundles
        if: ${{ steps.need.outputs.build == 'true' && (failure() || steps.ui.outcome == 'failure' || steps.quarantine.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-xcresult-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/AppTests.xcresult
            ${{ runner.temp }}/Quarantined.xcresult
            ${{ runner.temp }}/UISmoke.xcresult
          if-no-files-found: ignore
          retention-days: 7
